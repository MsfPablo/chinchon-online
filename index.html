<meta charset="utf-8">
<title>Mesa de Chinchón</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link id="chinchon-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap">
<style id="chinchon-css">
  :root{
    --felt:#134a3a;
    --felt-dark:#0d3a2d;
    --felt-line: rgba(255,255,255,0.08);
    --gold:#d3a34e;
    --gold-dim:#9c7c3f;
    --cream:#f4ecd8;
    --ink:#241a10;
    --ink-soft:#5b4a37;
    --card-bg:#fbf6ea;
    --card-border:#c9b98c;
    --panel:#0f3e30;
    --panel-border:rgba(211,163,78,0.35);
    --danger:#c0503f;
    --ok:#5f9c6e;
    --shadow: rgba(0,0,0,0.35);
  }
  :root:not([data-theme="light"]){
    /* dark == default felt look already dark; keep same tokens, slightly deepen */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --felt:#0e3c2f;
      --felt-dark:#082922;
      --panel:#0b2f24;
    }
  }
  :root[data-theme="dark"]{
    --felt:#0e3c2f;
    --felt-dark:#082922;
    --panel:#0b2f24;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--felt) 0%, var(--felt-dark) 78%);
    background-color:var(--felt-dark);
    color:var(--cream);
    font-family:'Karla', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 40px;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    text-wrap:balance;
  }
  .brand{
    text-align:center;
    margin:4px 0 18px;
  }
  .brand h1{
    font-size:clamp(28px,4vw,40px);
    font-weight:700;
    letter-spacing:0.5px;
    margin:0 0 2px;
    color:var(--gold);
  }
  .brand .sub{
    font-size:12.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--cream);
    opacity:0.6;
  }

  .app{ width:100%; max-width:900px; }

  /* ---- Lobby / seat claim ---- */
  .lobby{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:16px;
    padding:32px 28px;
    text-align:center;
    box-shadow:0 12px 30px var(--shadow);
  }
  .lobby p{ color:var(--cream); opacity:0.85; line-height:1.6; max-width:52ch; margin:0 auto 22px; }
  .seat-row{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:18px;}
  .seat-btn{
    font-family:'Fraunces',serif;
    font-size:17px;
    padding:14px 26px;
    border-radius:10px;
    border:1px solid var(--gold-dim);
    background:linear-gradient(180deg, #1a5a45, #0f3e30);
    color:var(--gold);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .seat-btn:hover{ transform:translateY(-2px); box-shadow:0 6px 16px var(--shadow); }
  .seat-btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}
  .join-form{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:14px;
  }
  .join-input{
    font-family:'Fraunces',serif;
    font-size:26px; font-weight:700; letter-spacing:5px; text-align:center;
    text-transform:uppercase;
    padding:12px 18px; width:min(280px,80vw);
    border-radius:10px;
    border:1px solid var(--gold-dim);
    background:rgba(0,0,0,0.22);
    color:var(--gold);
  }
  .join-input::placeholder{ color:var(--gold); opacity:0.28; }
  .join-input:focus{ outline:2px solid var(--gold); outline-offset:2px; }
  .join-go{ font-size:15px; padding:14px 24px; }
  .join-error{
    color:#f0a898; font-size:13.5px; margin:0 auto 12px !important; max-width:46ch;
  }
  .waiting{
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-size:13px; color:var(--cream); opacity:0.85;
    background:rgba(0,0,0,0.2); border-radius:10px; padding:11px 16px;
  }
  .waiting-dot{
    width:8px; height:8px; border-radius:50%; background:var(--gold);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:0.3} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce){ .waiting-dot{ animation:none; } }
  .leave-link{
    background:none; border:none; color:var(--cream); opacity:0.5;
    font-family:'Karla',sans-serif; font-size:12px; cursor:pointer;
    text-decoration:underline; padding:6px;
  }
  .leave-link:hover{ opacity:0.85; }

  .room-code{
    display:inline-flex; align-items:center; gap:12px;
    padding:10px 20px; margin-bottom:14px;
    border:1px solid var(--panel-border); border-radius:10px;
    background:rgba(0,0,0,0.18);
  }
  .room-label{
    font-size:10px; letter-spacing:1.8px; text-transform:uppercase;
    color:var(--cream); opacity:0.6;
  }
  .room-value{
    font-family:'Fraunces',serif; font-size:26px; font-weight:700;
    letter-spacing:5px; color:var(--gold);
  }
  .room-hint{ font-size:12px; opacity:0.7 !important; margin-bottom:18px !important; }
  .share-box{
    display:flex; gap:8px; margin-top:10px; justify-content:center; flex-wrap:wrap;
  }
  .share-box input{
    font-family:'Karla',sans-serif;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:var(--felt-dark);
    color:var(--cream);
    width:min(360px,80vw);
  }
  .copy-btn{
    font-family:'Karla',sans-serif;
    font-size:13px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--gold-dim);
    background:transparent;
    color:var(--gold);
    cursor:pointer;
  }
  .copy-btn:hover{ background:rgba(211,163,78,0.12); }

  /* ---- Scoreboard ---- */
  .scoreboard{
    display:flex; gap:12px; width:100%; margin-bottom:14px; flex-wrap:wrap;
  }
  .score-card{
    flex:1; min-width:150px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .score-card.active{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .score-card .name{ font-family:'Fraunces',serif; font-size:15px; color:var(--cream); }
  .score-card .tag{ font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); opacity:0.85;}
  .score-card .pts{ font-family:'Fraunces',serif; font-size:26px; color:var(--gold); font-variant-numeric:tabular-nums; }
  .score-card .round{font-size:11px;color:var(--cream);opacity:0.55;}

  /* ---- table ---- */
  .table{
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.032) 0 2px, transparent 2px 4px),
      radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.24)), var(--felt);
    border:1px solid var(--felt-line);
    border-radius:20px;
    padding:22px 16px 26px;
    box-shadow:0 16px 40px var(--shadow), inset 0 0 60px rgba(0,0,0,0.25);
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .opp-row{ display:flex; align-items:center; justify-content:center; gap:8px; min-height:70px; }
  .opp-hand{ display:flex; gap:-10px; }
  .facedown{
    width:38px;height:54px;border-radius:6px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 7px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.14) 0 3px, transparent 3px 7px),
      linear-gradient(150deg, #8f3a33 0%, #6d2723 100%);
    border:1px solid rgba(0,0,0,0.4);
    margin-left:-16px;
    box-shadow:0 3px 6px var(--shadow);
  }
  .facedown:first-child{margin-left:0;}

  .center-row{
    display:flex; align-items:center; justify-content:center; gap:34px; padding:6px 0;
    flex-wrap:wrap;
  }
  .pile{ text-align:center; }
  .pile .label{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--cream); opacity:0.55; margin-bottom:8px;}
  .card{
    width:66px;height:96px;border-radius:8px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    box-shadow:0 4px 10px var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink);
    font-family:'Fraunces',serif;
    position:relative;
    user-select:none;
    flex-shrink:0;
  }
  .card{
    width:66px; height:96px;
    /* aged paper: warm ground, soft bloom at the top-left, dusty edges */
    background:
      radial-gradient(120% 90% at 28% 18%, #fffdf6 0%, #faf3e2 46%, #f0e5c9 100%);
    border:1px solid #cbb98f;
    border-radius:7px;
    justify-content:center;
    overflow:hidden;
    box-shadow:
      0 1px 1px rgba(0,0,0,0.18),
      0 5px 12px rgba(0,0,0,0.30),
      inset 0 1px 0 rgba(255,255,255,0.75);
  }
  /* the printed frame; pintas break it to identify the suit */
  .card .frame{
    position:absolute; inset:5px;
    border:1.4px solid currentColor;
    border-radius:3px;
    opacity:0.55;
    pointer-events:none;
  }
  .card .pinta{
    position:absolute;
    width:11px; height:6px;
    margin-left:-5.5px;
    background:#faf3e2;
    pointer-events:none;
  }
  .card .pinta.top{ top:2.6px; }
  .card .pinta.bot{ bottom:2.6px; }

  .card .corner{
    position:absolute;
    font-size:12.5px;
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
    z-index:2;
  }
  .card .corner.tl{ top:9px; left:9px; }
  .card .corner.br{ bottom:9px; right:9px; transform:rotate(180deg); }

  .card .pip{
    position:absolute;
    width:18px; height:18px;
    margin-left:-9px; margin-top:-9px;
  }
  .card .pip svg{ width:100%; height:100%; display:block; }
  .card .pip-ace{
    width:42px; height:42px;
    margin-left:-21px; margin-top:-21px;
  }

  .card .court{ display:block; width:44px; height:62px; margin-top:-4px; }
  .card .court svg{ width:100%; height:100%; display:block; }
  .card .court-suit{
    position:absolute; top:9px; right:8px;
    width:14px; height:14px; opacity:0.9;
  }
  .card .court-suit svg{ width:100%; height:100%; display:block; }
  .card .figure{
    position:absolute; bottom:10px; left:0; right:0;
    font-family:'Karla', sans-serif;
    font-size:7.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    text-align:center;
    opacity:0.75;
  }

  .card.oros{ color:#96690f;}
  .card.copas{ color:#a02f3a;}
  .card.espadas{ color:#2a5a86;}
  .card.bastos{ color:#3a7340;}
  .deck-stack{ position:relative; width:66px; height:96px; cursor:pointer; }
  .deck-stack .card{ position:absolute; top:0; left:0; }
  .deck-stack .card:nth-child(1){ transform:translate(2px,2px);}
  .deck-stack .card:nth-child(2){ transform:translate(0,0);}
  .deck-back{
    width:66px;height:96px;border-radius:8px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 7px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.14) 0 3px, transparent 3px 7px),
      linear-gradient(150deg, #8f3a33 0%, #6d2723 100%);
    border:1px solid rgba(0,0,0,0.4);
    box-shadow:0 4px 10px var(--shadow);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold); font-size:11px; letter-spacing:1px; text-align:center;
    cursor:pointer;
  }
  .deck-back.disabled{ cursor:not-allowed; opacity:0.5; }
  .deck-count{ font-size:11px; color:var(--cream); opacity:0.6; margin-top:6px; }
  .empty-slot{
    width:66px;height:96px;border-radius:8px;
    border:1.5px dashed var(--panel-border);
    display:flex;align-items:center;justify-content:center;
    color:var(--cream); opacity:0.4; font-size:11px;
  }

  .status-line{
    text-align:center; font-family:'Fraunces',serif; font-size:15px; color:var(--gold);
    min-height:22px;
  }

  .my-hand-wrap{
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .my-hand{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:6px 4px;
  }
  .card.mine{ cursor:pointer; transition:transform .14s ease, box-shadow .14s ease; }
  .card.mine:hover{
    transform:translateY(-8px);
    box-shadow:0 2px 2px rgba(0,0,0,0.2), 0 14px 22px rgba(0,0,0,0.4),
               inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .card.mine.selected{
    transform:translateY(-11px);
    box-shadow:0 0 0 2px var(--gold), 0 16px 26px rgba(0,0,0,0.45),
               inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .card.mine.melded::before{
    content:'';
    position:absolute; inset:0;
    border-radius:7px;
    box-shadow:inset 0 0 0 2px var(--ok);
    pointer-events:none;
  }

  .actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
  .btn{
    font-family:'Karla',sans-serif; font-weight:700; font-size:13.5px;
    padding:11px 20px; border-radius:9px; cursor:pointer; border:1px solid transparent;
    letter-spacing:0.2px;
  }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-primary{ background:var(--gold); color:var(--felt-dark); border-color:var(--gold); }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.08); }
  .btn-outline{ background:transparent; color:var(--gold); border-color:var(--gold-dim); }
  .btn-outline:hover:not(:disabled){ background:rgba(211,163,78,0.12); }
  .btn-danger{ background:transparent; color:#e08d7f; border-color:#8a3a2f;}

  .hint{ font-size:12px; color:var(--cream); opacity:0.55; text-align:center; max-width:60ch;}

  .log{
    margin-top:16px; width:100%; max-width:900px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:12px;
    padding:12px 16px; max-height:120px; overflow-y:auto;
  }
  .log .entry{ font-size:12.5px; color:var(--cream); opacity:0.8; padding:2px 0; }
  .log .entry b{ color:var(--gold); }

  .modal-back{
    position:fixed; inset:0; background:rgba(5,10,8,0.7); display:flex; align-items:center; justify-content:center; z-index:20; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    padding:28px; max-width:420px; width:100%; text-align:center;
    box-shadow:0 20px 50px var(--shadow);
  }
  .modal h2{ color:var(--gold); margin:0 0 10px; font-size:24px;}
  .modal p{ color:var(--cream); opacity:0.85; line-height:1.6; font-size:14px;}
  .modal .rounds-table{ text-align:left; margin:16px 0; font-size:13.5px; }
  .modal .rounds-table div{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--felt-line);}

  /* ---- Round / match summary ---- */
  .summary{
    background:linear-gradient(180deg, rgba(26,90,69,0.55), var(--panel));
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:26px 22px 24px;
    text-align:center;
    box-shadow:0 18px 44px var(--shadow);
    animation:rise .34s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }

  .summary-title{
    font-size:clamp(22px,3.4vw,30px); color:var(--gold); margin:0 0 4px;
  }
  .summary-note{ font-size:13px; color:var(--cream); opacity:0.75; margin:0 0 16px; }

  .summary-scores{
    max-width:440px; margin:14px auto 20px; text-align:left;
    border:1px solid var(--panel-border); border-radius:12px; overflow:hidden;
  }
  .summary-row{
    display:grid; grid-template-columns:1fr auto auto; gap:14px;
    align-items:center; padding:11px 16px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row.head{
    font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--cream); opacity:0.55; background:rgba(0,0,0,0.22);
  }
  .summary-row.me{ background:rgba(211,163,78,0.09); }
  .sr-name{ font-family:'Fraunces',serif; font-size:15px; color:var(--cream); }
  .sr-gain{ font-variant-numeric:tabular-nums; font-size:15px; min-width:64px; text-align:right; color:var(--cream); }
  .sr-gain.bad{ color:#e79b8b; }
  .sr-gain.good{ color:#7fc490; }
  .sr-total{
    font-family:'Fraunces',serif; font-size:20px; color:var(--gold);
    font-variant-numeric:tabular-nums; min-width:52px; text-align:right;
  }
  .sr-total.big{ font-size:28px; }
  .sr-pos{
    font-family:'Fraunces',serif; font-size:13px; color:var(--gold);
    opacity:0.7; width:26px;
  }
  .summary-row.final-row{ grid-template-columns:auto 1fr auto; }
  .summary-row.winner{
    background:rgba(211,163,78,0.16);
    box-shadow:inset 3px 0 0 var(--gold);
  }

  .reveal{ display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
  .reveal-row{
    background:rgba(0,0,0,0.2); border-radius:12px; padding:12px 14px;
  }
  .reveal-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:9px; gap:10px; flex-wrap:wrap;
  }
  .reveal-name{ font-family:'Fraunces',serif; font-size:14px; color:var(--cream); }
  .reveal-sum{ font-size:11.5px; letter-spacing:0.6px; color:var(--gold); opacity:0.9; }
  .reveal-cards{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .card.small{ width:50px; height:73px; }
  .card.small .corner{ font-size:10px; top:6px; left:6px; }
  .card.small .corner.br{ bottom:6px; right:6px; top:auto; left:auto; }
  .card.small .pip{ width:13px; height:13px; margin-left:-6.5px; margin-top:-6.5px; }
  .card.small .pip-ace{ width:30px; height:30px; margin-left:-15px; margin-top:-15px; }
  .card.small .court{ width:33px; height:46px; }
  .card.small .figure{ font-size:6px; bottom:7px; }
  .card.small .court-suit{ width:11px; height:11px; top:6px; right:6px; }

  .closed-card{
    width:50px; height:73px; border-radius:6px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 7px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.14) 0 3px, transparent 3px 7px),
      linear-gradient(150deg, #8f3a33 0%, #6d2723 100%);
    border:1px solid rgba(0,0,0,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:6px;
    opacity:0.75;
  }
  .closed-card span{
    font-size:7.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--gold); opacity:0.9;
  }

  .final-crown{ font-size:52px; line-height:1; margin-bottom:6px; animation:pop .5s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes pop{ from{opacity:0; transform:scale(.4)} to{opacity:1; transform:scale(1)} }
  .final-title{ font-size:clamp(26px,4.4vw,38px); color:var(--gold); margin:0 0 6px; }
  .final-why{ font-size:13.5px; color:var(--cream); opacity:0.8; max-width:46ch; margin:0 auto 4px; line-height:1.6; }
  .summary.win{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 18px 50px var(--shadow); }

  /* ---- Motion ---- */
  .deal-in{ animation:dealIn .34s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes dealIn{
    from{ opacity:0; transform:translateY(-14px) rotate(-4deg) scale(.9); }
    to{ opacity:1; transform:none; }
  }
  .discard-land{ animation:landOn .3s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes landOn{
    from{ opacity:0; transform:translateY(-26px) scale(1.06) rotate(3deg); }
    to{ opacity:1; transform:none; }
  }
  .score-card .pts{ transition:color .25s ease; }
  .score-card.bump .pts{ animation:bump .5s ease both; }
  @keyframes bump{ 0%{transform:scale(1)} 35%{transform:scale(1.32); color:#fff} 100%{transform:scale(1)} }
  .turn-flash{ animation:flash .5s ease both; }
  @keyframes flash{ 0%{opacity:.35} 100%{opacity:1} }

  @media (prefers-reduced-motion: reduce){

  function buildDeck(){
    var deck = [];
    SUITS.forEach(function(s){
      RANKS.forEach(function(r){
        deck.push({ id: s+'-'+r, suit:s, rank:r });
      });
    });
    return deck;
  }
  function cardValue(c){ return c.rank > 7 ? 10 : c.rank; }
  function shuffle(arr, seed){
    // seeded shuffle so both clients agree until we persist post-shuffle state anyway
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---------- Melding engine ----------
  // Find all valid melds (sets of same rank size>=3, runs of same suit consecutive size>=3)
  // consecutive order for runs: 1,2,3,4,5,6,7,10,11,12 (as in a real chinchón deck)
  var RUN_ORDER = RANKS;
  function runsInSuit(cardsBySuit){
    var out = [];
    var bySortedRank = cardsBySuit.slice().sort(function(a,b){ return RUN_ORDER.indexOf(a.rank) - RUN_ORDER.indexOf(b.rank); });
    for (var start = 0; start < bySortedRank.length; start++){
      var run = [bySortedRank[start]];
      for (var next = start+1; next < bySortedRank.length; next++){
        var lastIdx = RUN_ORDER.indexOf(run[run.length-1].rank);
        var curIdx = RUN_ORDER.indexOf(bySortedRank[next].rank);
        if (curIdx === lastIdx + 1){
          run.push(bySortedRank[next]);
        } else if (curIdx === lastIdx){
          continue; // duplicate rank same suit, skip (shouldn't happen w/ 1 deck)
        } else {
          break;
        }
      }
      if (run.length >= 3){
        // add this run and all sub-windows length>=3
        for (var len = 3; len <= run.length; len++){
          for (var s2 = 0; s2 + len <= run.length; s2++){
            out.push(run.slice(s2, s2+len));
          }
        }
      }
    }
    return out;
  }
  function allMelds(hand){
    var melds = [];
    // sets by rank
    var byRank = {};
    hand.forEach(function(c){ (byRank[c.rank] = byRank[c.rank]||[]).push(c); });
    Object.keys(byRank).forEach(function(r){
      var cards = byRank[r];
      if (cards.length >= 3) melds.push(cards.slice(0,3));
      if (cards.length === 4) { melds.push(cards.slice(0,4)); }
    });
    // runs by suit
    var bySuit = {};
    hand.forEach(function(c){ (bySuit[c.suit] = bySuit[c.suit]||[]).push(c); });
    Object.keys(bySuit).forEach(function(s){
      runsInSuit(bySuit[s]).forEach(function(run){ melds.push(run); });
    });
    return melds;
  }
  // Best partition: minimize deadwood value using disjoint melds. Small hands (<=8) so brute force with memo on remaining ids.
  function bestPartition(hand){
    var melds = allMelds(hand);
    var idOf = function(c){ return c.id; };
    var allIds = hand.map(idOf);
    var memo = {};
    function key(remainingSet){ return remainingSet.slice().sort().join(','); }
    function solve(remaining){
      if (remaining.length === 0) return { value:0, used:[] };
      var k = key(remaining);
      if (memo[k]) return memo[k];
      var remainingSet = {};
      remaining.forEach(function(id){ remainingSet[id]=true; });
      // option: leave one card as deadwood (try each), or apply a meld fully contained in remaining
      var best = null;
      // applying melds
      melds.forEach(function(m){
        var mIds = m.map(idOf);
        var fits = mIds.every(function(id){ return remainingSet[id]; });
        if (!fits) return;
        var rest = remaining.filter(function(id){ return mIds.indexOf(id) === -1; });
        var sub = solve(rest);
        var candidate = { value: sub.value, used: sub.used.concat([mIds]) };
        if (!best || candidate.value < best.value) best = candidate;
      });
      // leaving all remaining as deadwood (base case fallback)
      var deadVal = remaining.reduce(function(sum,id){
        var c = hand.filter(function(h){return h.id===id;})[0];
        return sum + cardValue(c);
      }, 0);
      if (!best || deadVal < best.value){
        best = { value: deadVal, used: [] };
      }
      memo[k] = best;
      return best;
    }
    var result = solve(allIds);
    var meldedIds = {};
    result.used.forEach(function(m){ m.forEach(function(id){ meldedIds[id]=true; }); });
    var deadCards = hand.filter(function(c){ return !meldedIds[c.id]; });
    return { deadwood: result.value, melds: result.used, deadCards: deadCards };
  }
  // Best score reachable by discarding ONE card face down (the closing card).
  function bestClose(hand){
    var best = Infinity, bestId = null;
    for (var i = 0; i < hand.length; i++){
      var rest = hand.filter(function(c){ return c.id !== hand[i].id; });
      var d = bestPartition(rest).deadwood;
      if (d < best){ best = d; bestId = hand[i].id; }
    }
    return { deadwood: best, cardId: bestId };
  }

  function isChinchon(hand){
    if (hand.length !== 7) return false;
    var suit = hand[0].suit;
    if (!hand.every(function(c){ return c.suit === suit; })) return false;
    var idxs = hand.map(function(c){ return RUN_ORDER.indexOf(c.rank); }).sort(function(a,b){return a-b;});
    for (var i=1;i<idxs.length;i++){ if (idxs[i] !== idxs[i-1]+1) return false; }
    return true;
  }

  function normaliseCode(raw){
    return String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);

    var deck = shuffle(buildDeck());

  function cardEl(c, extraClass, onClick){
    var div = document.createElement('div');
    div.className = 'card ' + c.suit + (extraClass ? ' '+extraClass : '');
    var isFigure = c.rank > 7;
    var inner = '<span class="frame"></span>';

    var n = PINTAS[c.suit];
    for (var pi = 0; pi < n; pi++){
      var off = (n === 1) ? 50 : (n === 2 ? [36,64][pi] : [30,50,70][pi]);
      inner += '<span class="pinta top" style="left:'+off+'%"></span>' +
               '<span class="pinta bot" style="left:'+off+'%"></span>';
    }

    inner += '<span class="corner tl">'+RANK_LABEL[c.rank]+'</span>' +
             '<span class="corner br">'+RANK_LABEL[c.rank]+'</span>';

    if (isFigure){
      inner += '<span class="court">'+FIGURE_SVG[c.rank]+'</span>' +
               '<span class="court-suit">'+SUIT_SVG[c.suit]+'</span>' +
               '<span class="figure">'+FIGURE_NAME[c.rank]+'</span>';
    } else {
      // The ace carries one large device, the way a real Spanish deck prints it.
      var pipCls = c.rank === 1 ? 'pip pip-ace' : 'pip';
      PIP_LAYOUT[c.rank].forEach(function(p){
        inner += '<span class="'+pipCls+'" style="left:'+p[0]+'%;top:'+p[1]+'%">'+SUIT_SVG[c.suit]+'</span>';
      });
    }
    div.innerHTML = inner;
    div.setAttribute('aria-label', RANK_LABEL[c.rank] + ' de ' + SUIT_NAME[c.suit]);
    if (onClick) div.addEventListener('click', onClick);
    return div;
  }

  // A room exists only once somebody has taken a seat, which is also the moment
  // the game is first saved. Before that each browser holds an invented code,
  // so showing it would just tell the two players they disagree.
  function render(){
    var brandRoom = document.getElementById('brand-room');
    if (brandRoom){
      brandRoom.textContent = myRoom ? ' · sala ' + myRoom : '';
    }
    root.innerHTML = '';
    if (netStatus !== 'playing' && netStatus !== 'waiting'){
      logEl.style.display = 'none';
      renderConnect();
      return;
    }
    logEl.style.display = 'block';
    logEl.innerHTML = state.log.slice().reverse().map(function(l){
      return '<div class="entry">'+l+'</div>';
    }).join('');

    var mine = mySeat;
    var opp = mySeat === 0 ? 1 : 0;

    // A new round means a fresh deal: stagger the cards in.
    justDealt = (lastRound !== state.round);
    lastRound = state.round;

    // scoreboard
    var sb = document.createElement('div');
    sb.className = 'scoreboard';
    [0,1].forEach(function(i){
      var card = document.createElement('div');
      card.className = 'score-card' + (state.turn === i && !state.matchOver ? ' active' : '');
      var isMe = i === mine;
      card.innerHTML =
        '<div><div class="name">'+state.names[i]+(isMe?' (tú)':'')+'</div>' +
        '<div class="tag">'+(state.turn===i && !state.matchOver ? 'En turno' : '')+'</div></div>' +
        '<div style="text-align:right"><div class="pts">'+state.scores[i]+'</div><div class="round">ronda '+state.round+'</div></div>';
      if (lastScores[i] !== null && lastScores[i] !== state.scores[i]){
        card.classList.add('bump');
      }
      lastScores[i] = state.scores[i];
      sb.appendChild(card);
    });
    root.appendChild(sb);

    if (state.matchOver){
      renderMatchOver();
      return;
    }
    if (state.phase === 'roundOver'){
      renderRoundOver();
      return;
    }

    var table = document.createElement('div');
    table.className = 'table';

    // opponent row
    var oppRow = document.createElement('div');
    oppRow.className = 'opp-row';
    var oppHandWrap = document.createElement('div');
    oppHandWrap.className = 'opp-hand';
    state.hands[opp].forEach(function(){
      oppHandWrap.appendChild((function(){ var d=document.createElement('div'); d.className='facedown'; return d; })());
    });
    oppRow.appendChild(oppHandWrap);
    table.appendChild(oppRow);

    // center piles
    var centerRow = document.createElement('div');
    centerRow.className = 'center-row';

    var myTurn = state.turn === mine && !state.matchOver;
    var canDraw = myTurn && state.phase === 'draw';
    var canDiscard = myTurn && state.phase === 'discard';

    // deck pile
    var deckPile = document.createElement('div');
    deckPile.className = 'pile';
    var deckLabel = document.createElement('div');
    deckLabel.className = 'label';
    deckLabel.textContent = 'Mazo';
    deckPile.appendChild(deckLabel);
    var deckBack = document.createElement('div');
    deckBack.className = 'deck-back' + (canDraw && state.deck.length ? '' : ' disabled');
    deckBack.textContent = state.deck.length ? '' : 'vacío';
    if (canDraw && state.deck.length){
      deckBack.addEventListener('click', function(){ doDraw('deck'); });
    }
    deckPile.appendChild(deckBack);
    var deckCount = document.createElement('div');
    deckCount.className = 'deck-count';
    deckCount.textContent = state.deck.length + ' cartas';
    deckPile.appendChild(deckCount);
    centerRow.appendChild(deckPile);

    // discard pile
    var discPile = document.createElement('div');
    discPile.className = 'pile';
    var discLabel = document.createElement('div');
    discLabel.className = 'label';
    discLabel.textContent = 'Descarte';
    discPile.appendChild(discLabel);
    if (state.discard.length){
      var topDisc = state.discard[state.discard.length-1];
      var dEl = cardEl(topDisc, canDraw ? 'mine' : '');
      if (lastDiscardId !== topDisc.id){ dEl.classList.add('discard-land'); }
      lastDiscardId = topDisc.id;
      if (canDraw){
        dEl.addEventListener('click', function(){ doDraw('discard'); });
      }
      discPile.appendChild(dEl);
    } else {
      var empty = document.createElement('div');
      empty.className = 'empty-slot';
      empty.textContent = '—';
      discPile.appendChild(empty);
    }
    centerRow.appendChild(discPile);

    table.appendChild(centerRow);

    if (netStatus === 'waiting'){
      var waitEl = document.createElement('div');
      waitEl.className = 'waiting';
      waitEl.innerHTML =
        '<span class="waiting-dot"></span>Sala <b>' + myRoom + '</b> abierta. ' +
        'Dile a tu amigo que escriba ese mismo código.';
      table.appendChild(waitEl);
    }

    // status
    var status = document.createElement('div');
    status.className = 'status-line';
    if (state.matchOver){
      status.textContent = '';
    } else if (myTurn){
      status.textContent = state.phase === 'draw' ? 'Tu turno: roba del mazo o del descarte.' : 'Elige una carta de tu mano y descártala (o cierra la ronda).';
    } else {
      status.textContent = state.names[opp] + ' está jugando...';
    }
    table.appendChild(status);

    // my hand
    var myWrap = document.createElement('div');
    myWrap.className = 'my-hand-wrap';
    var myHandEl = document.createElement('div');
    myHandEl.className = 'my-hand';

    var myHand = state.hands[mine].slice().sort(function(a,b){
      if (a.suit !== b.suit) return SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit);
      return RUN_ORDER.indexOf(a.rank) - RUN_ORDER.indexOf(b.rank);
    });
    var partition = myHand.length >= 3 ? bestPartition(myHand) : { deadwood: myHand.reduce(function(s,c){return s+cardValue(c);},0), melds: [], deadCards: myHand };
    var meldedSet = {};
    partition.melds.forEach(function(m){ m.forEach(function(id){ meldedSet[id]=true; }); });

    myHand.forEach(function(c, ci){
      var cls = 'mine' + (meldedSet[c.id] ? ' melded' : '') + (selectedCardId === c.id ? ' selected' : '');
      var el = cardEl(c, cls, function(){
        if (!canDiscard) return;
        selectedCardId = (selectedCardId === c.id) ? null : c.id;
        render();
      });
      if (justDealt){
        el.classList.add('deal-in');
        el.style.animationDelay = (ci * 60) + 'ms';
      }
      myHandEl.appendChild(el);
    });
    myWrap.appendChild(myHandEl);

    var hint = document.createElement('div');
    hint.className = 'hint';
    if (myHand.length === 8){
      var ci = bestClose(myHand);
      hint.innerHTML = ci.deadwood <= 5
        ? '<span style="color:var(--ok)">Puedes cerrar</span>: descarta una carta boca abajo y te quedan <b>' +
          ci.deadwood + ' puntos</b>. Esa carta no cuenta.'
        : 'Descartando tu peor carta te quedarían <b>' + ci.deadwood +
          ' puntos</b> · para cerrar hacen falta 5 o menos.';
    } else {
      hint.innerHTML = 'Cartas sueltas: <b>' + partition.deadwood +
        ' puntos</b> · las de contorno verde están combinadas.';
    }
    myWrap.appendChild(hint);

    var actions = document.createElement('div');
    actions.className = 'actions';

    var discardBtn = document.createElement('button');
    discardBtn.className = 'btn btn-primary';
    discardBtn.textContent = 'Descartar carta seleccionada';
    discardBtn.disabled = !canDiscard || !selectedCardId;
    discardBtn.addEventListener('click', function(){ doDiscard(selectedCardId); });
    actions.appendChild(discardBtn);

    var closeBtn = document.createElement('button');
    closeBtn.className = 'btn btn-outline';
    // Closing discards the selected card face down; only the other 7 count.
    var closeInfo = (canDiscard && myHand.length === 8) ? bestClose(myHand) : null;
    var selectedClosesOk = !!(closeInfo && selectedCardId &&
      bestPartition(myHand.filter(function(c){ return c.id !== selectedCardId; })).deadwood <= 5);

    closeBtn.textContent = selectedClosesOk ? 'Cerrar con esta carta ✓' : 'Cerrar ronda';
    closeBtn.disabled = !selectedClosesOk;
    closeBtn.title = !closeInfo ? 'Solo puedes cerrar en tu turno, tras robar.'
      : (closeInfo.deadwood > 5
          ? 'Aún no puedes cerrar: lo mejor que te quedaría son ' + closeInfo.deadwood + ' puntos, y hacen falta 5 o menos.'
          : (selectedClosesOk
              ? 'Cierra descartando esta carta boca abajo. No se cuenta.'
              : 'Selecciona la carta que quieres descartar boca abajo para cerrar.'));
    closeBtn.addEventListener('click', function(){ doClose(selectedCardId); });
    actions.appendChild(closeBtn);

    myWrap.appendChild(actions);
    table.appendChild(myWrap);

    root.appendChild(table);

    var leave = document.createElement('button');
    leave.className = 'leave-link';
    leave.textContent = 'Salir de la sala ' + myRoom;
    leave.addEventListener('click', leaveRoom);
    var leaveWrap = document.createElement('div');
    leaveWrap.style.textAlign = 'center';
    leaveWrap.appendChild(leave);
    root.appendChild(leaveWrap);
  }

  function renderConnect(){
    var box = document.createElement('div');
    box.className = 'lobby';

    if (netStatus === 'connecting'){
      box.innerHTML =
        '<h2 style="color:var(--gold);margin:0 0 10px;">Conectando…</h2>' +
        '<div class="waiting" style="justify-content:center">' +
        '<span class="waiting-dot"></span>Buscando la sala <b>' + (myRoom||'') + '</b></div>';
      root.appendChild(box);
      return;
    }

    if (netStatus === 'lost'){
      box.innerHTML =
        '<h2 style="color:var(--gold);margin:0 0 10px;">Se cortó la conexión</h2>' +
        '<p>Tu amigo ha cerrado la página o se ha ido la red. Volved a entrar los dos con el mismo código.</p>';
      var again = document.createElement('button');
      again.className = 'btn btn-primary';
      again.textContent = 'Volver a empezar';
      again.addEventListener('click', leaveRoom);
      box.appendChild(again);
      root.appendChild(box);
      return;
    }

    box.innerHTML =
      '<h2 style="color:var(--gold);margin:0 0 8px;">Entrad con el mismo código</h2>' +
      '<p>Poneos de acuerdo por WhatsApp en una palabra o número — la que queráis — y escribidla los dos. ' +
      'Quien escriba el mismo código juega contigo, en directo. No hace falta cuenta ni registro.</p>';

    var form = document.createElement('form');
    form.className = 'join-form';

    var input = document.createElement('input');
    input.className = 'join-input';
    input.type = 'text';
    input.placeholder = 'PABLO7';
    input.setAttribute('autocapitalize','characters');
    input.setAttribute('autocomplete','off');
    input.setAttribute('autocorrect','off');
    input.setAttribute('spellcheck','false');
    input.setAttribute('aria-label','Código de sala');
    input.value = myRoom || '';

    var go = document.createElement('button');
    go.type = 'submit';
    go.className = 'btn btn-primary join-go';
    go.textContent = 'Entrar';

    form.appendChild(input);
    form.appendChild(go);
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      connectRoom(input.value);
    });
    box.appendChild(form);

    if (netDetail){
      var err = document.createElement('p');
      err.className = 'join-error';
      err.textContent = netDetail;
      box.appendChild(err);
    }

    var hint = document.createElement('p');
    hint.className = 'room-hint';
    hint.textContent = 'El primero que entre abre la sala y espera; el segundo se conecta al instante.';
    box.appendChild(hint);

    root.appendChild(box);
    setTimeout(function(){ try { input.focus(); } catch(e){} }, 50);
  }

  function handRow(seat, sum){
    var wrap = document.createElement('div');
    wrap.className = 'reveal-row';

    var head = document.createElement('div');
    head.className = 'reveal-head';
    head.innerHTML =
      '<span class="reveal-name">' + state.names[seat] + (seat === mySeat ? ' (tú)' : '') + '</span>' +
      '<span class="reveal-sum">' + sum + ' pts sin combinar</span>';
    wrap.appendChild(head);

    var cards = document.createElement('div');
    cards.className = 'reveal-cards';
    var melded = {};
    (state.roundSummary.melds[seat] || []).forEach(function(m){
      m.forEach(function(id){ melded[id] = true; });
    });
    state.roundSummary.hands[seat].forEach(function(c, i){
      var el = cardEl(c, melded[c.id] ? 'melded small' : 'small');
      el.style.animationDelay = (i * 55) + 'ms';
      el.classList.add('deal-in');
      cards.appendChild(el);
    });
    // The closing card sits face down: it was discarded and never counted.
    if (state.roundSummary.closedCard && seat === state.roundSummary.closer){
      var fd = document.createElement('div');
      fd.className = 'closed-card';
      fd.title = 'Carta de cierre, boca abajo: no cuenta';
      fd.innerHTML = '<span>cierre</span>';
      cards.appendChild(fd);
    }
    wrap.appendChild(cards);
    return wrap;
  }

  function renderRoundOver(){
    var rs = state.roundSummary;
    if (!rs) return;

    var panel = document.createElement('div');
    panel.className = 'summary';

    var title = rs.chinchon ? '¡CHINCHÓN!'
      : (rs.closer === mySeat ? 'Has cerrado la ronda' : state.names[rs.closer] + ' ha cerrado');
    panel.innerHTML =
      '<h2 class="summary-title">' + title + '</h2>' +
      (rs.dry ? '<p class="summary-note">Cierre en seco: 10 puntos menos.</p>' : '');

    var table = document.createElement('div');
    table.className = 'summary-scores';
    [0,1].forEach(function(i){
      var g = rs.gained[i];
      var row = document.createElement('div');
      row.className = 'summary-row' + (i === mySeat ? ' me' : '');
      row.innerHTML =
        '<span class="sr-name">' + state.names[i] + (i === mySeat ? ' (tú)' : '') + '</span>' +
        '<span class="sr-gain ' + (g > 0 ? 'bad' : (g < 0 ? 'good' : '')) + '">' +
          (g > 0 ? '+' + g : (g < 0 ? g : '0')) + '</span>' +
        '<span class="sr-total">' + state.scores[i] + '</span>';
      table.appendChild(row);
    });
    var hdr = document.createElement('div');
    hdr.className = 'summary-row head';
    hdr.innerHTML = '<span class="sr-name">Jugador</span><span class="sr-gain">Esta ronda</span><span class="sr-total">Total</span>';
    table.insertBefore(hdr, table.firstChild);
    panel.appendChild(table);

    var reveal = document.createElement('div');
    reveal.className = 'reveal';
    reveal.appendChild(handRow(0, rs.deadwood[0]));
    reveal.appendChild(handRow(1, rs.deadwood[1]));
    panel.appendChild(reveal);

    var go = document.createElement('button');
    go.className = 'btn btn-primary';
    go.textContent = 'Siguiente ronda';
    go.addEventListener('click', function(){ act({ type:'nextRound' }); });
    panel.appendChild(go);

    root.appendChild(panel);
  }

  function renderMatchOver(){
    var iWon = state.winner === mySeat;
    var panel = document.createElement('div');
    panel.className = 'summary final' + (iWon ? ' win' : ' lose');

    panel.innerHTML =
      '<div class="final-crown">' + (iWon ? '🏆' : '🃏') + '</div>' +
      '<h2 class="final-title">' + (iWon ? '¡Has ganado!' : 'Ha ganado ' + state.names[state.winner]) + '</h2>' +
      '<p class="final-why">' +
        (state.endReason === 'chinchon'
          ? state.names[state.winner] + ' cerró con un chinchón: escalera de siete cartas del mismo palo.'
          : 'Se alcanzaron los 100 puntos. Gana quien menos puntos tiene.') +
      '</p>';

    var table = document.createElement('div');
    table.className = 'summary-scores';
    var order = state.scores[0] <= state.scores[1] ? [0,1] : [1,0];
    order.forEach(function(i, pos){
      var row = document.createElement('div');
      row.className = 'summary-row final-row' + (i === state.winner ? ' winner' : '') + (i === mySeat ? ' me' : '');
      row.innerHTML =
        '<span class="sr-pos">' + (pos + 1) + 'º</span>' +
        '<span class="sr-name">' + state.names[i] + (i === mySeat ? ' (tú)' : '') + '</span>' +
        '<span class="sr-total big">' + state.scores[i] + '</span>';
      table.appendChild(row);
    });
    panel.appendChild(table);

    var rounds = document.createElement('p');
    rounds.className = 'summary-note';
    rounds.textContent = 'Partida de ' + state.round + (state.round === 1 ? ' ronda.' : ' rondas.');
    panel.appendChild(rounds);

    var again = document.createElement('button');
    again.className = 'btn btn-primary';
    again.textContent = 'Jugar otra partida';
    again.addEventListener('click', function(){ act({ type:'rematch' }); });
    panel.appendChild(again);

    root.appendChild(panel);
  }

  // ---------- Actions ----------
  // The HOST owns the game state. Both players send the same action objects;
  // the host applies them and broadcasts the result, so the two screens can
  // never drift apart.
  function act(a){
    if (isHost) applyAction(a, 0);
    else if (conn && conn.open) conn.send({ t:'action', a:a });
  }

  function applyAction(a, seat){
    var next = JSON.parse(JSON.stringify(state));
    if (a.type === 'draw') mutDraw(next, seat, a.source);
    else if (a.type === 'discard') mutDiscard(next, seat, a.cardId);
    else if (a.type === 'close') mutClose(next, seat, a.cardId);
    else if (a.type === 'nextRound') mutNextRound(next);
    else if (a.type === 'rematch') next = mutRematch(next);
    state = next;
    sendState();
    render();
  }

  function mutDraw(s, seat, source){
    if (s.turn !== seat || s.phase !== 'draw') return;
    var card;
    if (source === 'deck'){
      if (!s.deck.length) return;
      card = s.deck.pop();
    } else {
      if (!s.discard.length) return;
      card = s.discard.pop();
    }
    s.hands[seat].push(card);
    s.phase = 'discard';
    s.drawnFrom = source;
    pushLog(s, s.names[seat] + ' roba ' + (source === 'deck' ? 'del mazo' : 'del descarte') + '.');
  }

  function mutDiscard(s, seat, cardId){
    if (s.turn !== seat || s.phase !== 'discard') return;
    var hand = s.hands[seat];
    var idx = -1;
    for (var i = 0; i < hand.length; i++){ if (hand[i].id === cardId){ idx = i; break; } }
    if (idx === -1) return;
    var card = hand.splice(idx,1)[0];
    s.discard.push(card);
    pushLog(s, s.names[seat] + ' descarta ' + RANK_LABEL[card.rank] + ' de ' + SUIT_NAME[card.suit] + '.');
    if (!s.deck.length && s.discard.length > 1){
      var top = s.discard.pop();
      s.deck = shuffle(s.discard);
      s.discard = [top];
      pushLog(s, 'El mazo se agotó: se baraja el descarte.');
    }
    s.turn = s.turn === 0 ? 1 : 0;
    s.phase = 'draw';
    s.drawnFrom = null;
  }

  function mutClose(s, seat, closeCardId){
    if (s.turn !== seat || s.phase !== 'discard') return;
    var hand = s.hands[seat];
    if (hand.length !== 8) return;

    // Closing means discarding one card FACE DOWN onto the pile. That card is
    // not part of your hand any more, so only the remaining seven are scored.
    var closeCard = null;
    for (var i = 0; i < hand.length; i++){
      if (hand[i].id === closeCardId){ closeCard = hand[i]; break; }
    }
    if (!closeCard) return;

    var seven = hand.filter(function(c){ return c.id !== closeCard.id; });
    var p = bestPartition(seven);
    // You may close when the cards left over add up to 5 or less.
    if (p.deadwood > 5) return;

    var dry = p.deadCards.length === 0;          // "cierre en seco"
    var wasChinchon = isChinchon(seven);

    // The closing card goes face down on the discard pile.
    s.hands[seat] = seven;
    s.discard.push(closeCard);
    s.closedCard = closeCard;

    var opp = seat === 0 ? 1 : 0;
    var oppP = bestPartition(s.hands[opp]);

    var gained = [0,0];
    gained[opp] = oppP.deadwood;
    gained[seat] = dry ? -10 : p.deadwood;       // closing dry takes 10 off

    s.scores[seat] += gained[seat];
    s.scores[opp] += gained[opp];

    s.phase = 'roundOver';
    s.roundSummary = {
      closer: seat,
      chinchon: wasChinchon,
      dry: dry,
      closedCard: true,
      gained: gained,
      hands: [s.hands[0].slice(), s.hands[1].slice()],
      melds: [bestPartition(s.hands[0]).melds, bestPartition(s.hands[1]).melds],
      deadwood: [bestPartition(s.hands[0]).deadwood, bestPartition(s.hands[1]).deadwood]
    };

    pushLog(s, s.names[seat] + ' cierra' + (dry ? ' en seco' : '') +
      (wasChinchon ? ' — ¡CHINCHÓN!' : '') + '.');
    pushLog(s, s.names[opp] + ' suma ' + gained[opp] + ' · ' +
      s.names[seat] + ' ' + (gained[seat] < 0 ? 'resta ' + Math.abs(gained[seat]) : 'suma ' + gained[seat]) + '.');

    // Chinchón wins the whole match outright.
    if (wasChinchon){
      s.matchOver = true;
      s.winner = seat;
      s.endReason = 'chinchon';
      pushLog(s, '¡' + s.names[seat] + ' gana la partida con CHINCHÓN!');
      return;
    }

    if (s.scores[0] >= 100 || s.scores[1] >= 100){
      s.matchOver = true;
      // Whoever has FEWER points wins.
      s.winner = s.scores[0] === s.scores[1] ? seat : (s.scores[0] < s.scores[1] ? 0 : 1);
      s.endReason = 'limit';
      pushLog(s, '¡Partida terminada! Gana ' + s.names[s.winner] + '.');
    }
  }

  function mutNextRound(s){
    if (s.phase !== 'roundOver' || s.matchOver) return;
    var deck = shuffle(buildDeck());
    s.hands = [deck.splice(0,7), deck.splice(0,7)];
    s.discard = deck.splice(0,1);
    s.deck = deck;
    s.round = s.round + 1;
    s.turn = s.round % 2 === 0 ? 1 : 0;
    s.phase = 'draw';
    s.drawnFrom = null;
    s.roundSummary = null;
    pushLog(s, 'Comienza la ronda ' + s.round + '.');
  }

  function mutRematch(prev){
    var s = freshState();
    s.names = prev.names;
    return s;
  }

  function doDraw(source){ selectedCardId = null; act({ type:'draw', source:source }); }
  function doDiscard(cardId){
    if (!cardId) return;
    selectedCardId = null;
    act({ type:'discard', cardId:cardId });
  }
  function doClose(cardId){
    if (!cardId) return;
    selectedCardId = null;
    act({ type:'close', cardId:cardId });
  }

  // ---------- Network: direct browser-to-browser, no accounts, no game server ----------
  // Both players type the same code. That code IS the address: the first to
  // arrive registers it and becomes host; the second finds it taken and dials
  // in. A random code could never match across two devices, which is why
  // matching has to be player-chosen.
  var ROOM_PREFIX = 'chinchon-baraja-esp-v3-';

  function setStatus(st, detail){
    netStatus = st;
    netDetail = detail || null;
    render();
  }

  function connectRoom(rawCode){
    var code = normaliseCode(rawCode);
    if (code.length < 3){
      setStatus('form', 'Escribe un código de al menos 3 caracteres.');
      return;
    }
    if (typeof Peer === 'undefined'){
      setStatus('form', 'No se ha podido cargar la conexión. Comprueba tu internet y recarga.');
      return;
    }
    myRoom = code;
    try { localStorage.setItem('chinchon-room', code); } catch(e){}
    setStatus('connecting');
    startAsHost(ROOM_PREFIX + code);
  }

  function startAsHost(hostId){
    destroyPeer();
    peer = new Peer(hostId, { debug: 0 });
    isHost = true;
    mySeat = 0;

    peer.on('open', function(){
      state = freshState();
      setStatus('waiting');
    });
    peer.on('connection', function(c){
      conn = c;
      wireConn();
    });
    peer.on('error', function(err){
      if (err && err.type === 'unavailable-id'){
        startAsGuest(hostId);           // someone is already hosting this code
      } else if (netStatus !== 'playing'){
        setStatus('form', 'No se pudo conectar (' + ((err && err.type) || 'error') + '). Inténtalo otra vez.');
      }
    });
  }

  function startAsGuest(hostId){
    destroyPeer();
    peer = new Peer({ debug: 0 });
    isHost = false;
    mySeat = 1;

    peer.on('open', function(){
      conn = peer.connect(hostId, { reliable: true });
      wireConn();
      setTimeout(function(){
        if (netStatus === 'connecting'){
          setStatus('form', 'Tu amigo no responde en la sala ' + myRoom + '. Que la abra él primero, o probad otro código.');
        }
      }, 12000);
    });
    peer.on('error', function(err){
      if (netStatus !== 'playing'){
        setStatus('form', 'No se pudo entrar en la sala (' + ((err && err.type) || 'error') + ').');
      }
    });
  }

  function wireConn(){
    conn.on('open', function(){
      setStatus('playing');
      if (isHost) sendState();
    });
    conn.on('data', function(msg){
      if (!msg || typeof msg !== 'object') return;
      if (msg.t === 'state'){
        state = msg.s;
        render();
      } else if (msg.t === 'action' && isHost){
        applyAction(msg.a, 1);
      }
    });
    conn.on('close', function(){
      if (netStatus === 'playing') setStatus('lost');
    });
    conn.on('error', function(){
      if (netStatus === 'playing') setStatus('lost');
    });
  }

  function sendState(){
    if (isHost && conn && conn.open) conn.send({ t:'state', s: state });
  }

  function destroyPeer(){
    try { if (peer) peer.destroy(); } catch(e){}
    peer = null;
    conn = null;
  }

  function leaveRoom(){
    destroyPeer();
    myRoom = null; mySeat = null; isHost = false;
    try { localStorage.removeItem('chinchon-room'); } catch(e){}
    setStatus('form');
  }

  function init(){
    try { myRoom = localStorage.getItem('chinchon-room') || null; } catch(e){}
    setStatus('form');
  }

  init();

})();
</script>
